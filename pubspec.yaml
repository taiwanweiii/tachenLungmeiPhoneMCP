name: curtain_mcp_flutter
description: "CurtainMCP 窗簾訂單語音助理 - 跨平台版本"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── 網路通訊 ──────────────────────────────────────────
  dio: ^5.4.3

  # ── 狀態管理 ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── 依賴注入 ──────────────────────────────────────────
  get_it: ^7.6.7

  # ── 設定檔 ────────────────────────────────────────────
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.2

  # ── 資料庫（對話持久化）────────────────────────────────
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # ── 語音錄製 ──────────────────────────────────────────
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # ── STT（手機內建，不需後端）─────────────────────────  ← 新增
  #speech_to_text: ^6.3.0

  # ── TTS（手機內建，不需後端）─────────────────────────
  flutter_tts: ^4.2.0

  # ── UI 元件 ────────────────────────────────────────────
  flutter_markdown: ^0.7.4
  avatar_glow: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # ── 連線狀態 ──────────────────────────────────────────
  connectivity_plus: ^6.0.5

  # ── 分享匯出 ──────────────────────────────────────────
  share_plus: ^10.0.0

  # ── 工具 ──────────────────────────────────────────────
  logger: ^2.3.0
  url_launcher: ^6.3.3

  # ── 內嵌系統櫃網頁（WebView + JS 橋接）──────────────────
  flutter_inappwebview: ^6.1.5
  web: ^1.1.0   # Chrome 版（Flutter Web）用 iframe 嵌入網頁

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env