name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, 'ci/**']

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        env:
          DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        run: |
          if [ -n "$DOTENV_BASE64" ]; then
            echo "$DOTENV_BASE64" | base64 --decode > .env
          else
            cp .env.example .env
          fi

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr CurtainMCP.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CurtainMCP-ipa
          path: build/ipa/CurtainMCP.ipa
          retention-days: 14
